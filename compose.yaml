services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE:-news_blog}"
      DB_USER: "${MYSQL_USER:-news_user}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-news_password}"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - smarty_storage:/var/www/html/storage/smarty
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-news_blog}"
      MYSQL_USER: "${MYSQL_USER:-news_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-news_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-news_blog}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        mysql --protocol=TCP --host=db --user=root
        --password="$$MYSQL_ROOT_PASSWORD" "$$MYSQL_DATABASE"
        < /migrations/001_initial_schema.sql
    restart: "no"

volumes:
  mysql_data:
  smarty_storage:
  vendor:
